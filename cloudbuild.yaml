steps:
  # Prediction API
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'prediction-api/Dockerfile' # Point to the Dockerfile...
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-api:latest'
      - '.'  # ...while keeping the build context as the root of the repository

  # Prediction UI
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-ui:latest', './prediction-ui']

  # Push Prediction API image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-api:latest']

  # Push Prediction UI image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-ui:latest']

  # Deploy Prediction API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prediction-api'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-api:latest'
      - '--region'
      - '$_LOCATION'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'

  # Deploy the Prediction UI to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Query Cloud Run for the exact URL of the deployed API
        API_URL=$(gcloud run services describe prediction-api --region $_LOCATION --format 'value(status.url)')
        
        echo "Dynamically extracted API URL: $$API_URL"
        
        # Deploy the UI, injecting the extracted URL into the PREDICTOR_API environment variable
        gcloud run deploy prediction-ui \
          --image $_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-ui:latest \
          --region $_LOCATION \
          --allow-unauthenticated \
          --set-env-vars PREDICTOR_API=$$API_URL/predict \
          --port 8501

options:
  logging: CLOUD_LOGGING_ONLY # Req'd when using Cloud Run trigger with Service Account

# Specify the images to be pushed
images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-api:latest'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/prediction-ui:latest'